name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V3 retries a program it cannot build with a downloaded older compiler unless told not to, which
# would let a V3 regression pass unseen. V uploads a source excerpt on a C compilation error
# unless reporting is disabled.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned V
        uses: ./.github/actions/setup-v

      - name: Unit tests
        run: v test .

      - name: Build the command
        run: mkdir -p bin && v -o bin/arxmodel cmd/arxmodel

      - name: The command on the synthetic model
        run: |
          bin/arxmodel load testdata/model/a.arxml testdata/model/sub
          bin/arxmodel rules --problems --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
