name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V3 retries a program it cannot build with a downloaded older compiler unless told not to, which
# would let a V3 regression pass unseen. V uploads a source excerpt on a C compilation error
# unless reporting is disabled.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pinned V
        uses: ./.github/actions/setup-v

      - name: Unit tests
        run: v test .

      - name: Build the command
        run: mkdir -p bin && v -o bin/arxmodel cmd/arxmodel

      - name: The command on the synthetic model
        run: |
          bin/arxmodel load testdata/model/a.arxml testdata/model/sub
          bin/arxmodel rules --problems --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel check --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel rules --schema-dir testdata/schemas --emit "$RUNNER_TEMP/lib.rules.txt" testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel check --rules "$RUNNER_TEMP/lib.rules.txt" testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel get --schema-dir testdata/schemas /Fiction/Dune testdata/refs
          bin/arxmodel list --schema-dir testdata/schemas BOOK testdata/refs
          bin/arxmodel policy
          bin/arxmodel policy --policy automat --diff spec
          bin/arxmodel check --policy automat --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel merge --schema-dir testdata/schemas -o "$RUNNER_TEMP/model.arxml" testdata/export
          bin/arxmodel check --schema-dir testdata/schemas "$RUNNER_TEMP/model.arxml"

      - name: Git merge and diff drivers, with no schema
        run: scripts/git_driver_test.sh bin/arxmodel

      - name: The input set through the command
        run: scripts/inputs_cli_test.sh bin/arxmodel

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reports against their schemas
        run: |
          python -m pip install --quiet jsonschema lxml
          scripts/check_reports.sh bin/arxmodel "$RUNNER_TEMP/reports"

      # The Windows build, made the way release.yml makes it (mingw-w64 from this Linux job's V), so a
      # change that breaks Windows is seen on its own push, not at the next tag. The job below runs it.
      - name: Build for Windows
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          mkdir -p dist
          v -prod -os windows -cc x86_64-w64-mingw32-gcc -o dist/arxmodel.exe cmd/arxmodel
          file dist/arxmodel.exe

      - uses: actions/upload-artifact@v7
        with:
          name: arxmodel-windows
          path: dist/arxmodel.exe
          if-no-files-found: error
          retention-days: 7

  # The Windows binary RUN on Windows: what release.yml's windows job checks before it publishes.
  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arxmodel-windows
          path: dist
      - name: Run on Windows
        run: |
          set -e
          ver="$(sed -n "s/^\s*version: '\(.*\)'\s*\$/\1/p" v.mod)"
          [ "$(dist/arxmodel.exe --version | tr -d '\r')" = "arxmodel $ver" ]
          dist/arxmodel.exe check --schema-dir testdata/schemas testdata/export
          dist/arxmodel.exe merge --schema-dir testdata/schemas -o "$RUNNER_TEMP/model.arxml" testdata/export
          # the only merge3 a -prod binary runs: a fault of the optimizer shows nowhere else
          scripts/merge3_cli_test.sh dist/arxmodel.exe
          dist/arxmodel.exe check --schema-dir testdata/schemas "$RUNNER_TEMP/model.arxml"
          dist/arxmodel.exe check --format json --schema-dir testdata/schemas testdata/merge > "$RUNNER_TEMP/merge.json" || [ $? -eq 1 ]
