name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V3 retries a program it cannot build with a downloaded older compiler unless told not to, which
# would let a V3 regression pass unseen. V uploads a source excerpt on a C compilation error
# unless reporting is disabled.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned V
        uses: ./.github/actions/setup-v

      - name: Unit tests
        run: v test .

      - name: Build the command
        run: mkdir -p bin && v -o bin/arxmodel cmd/arxmodel

      - name: The command on the synthetic model
        run: |
          bin/arxmodel load testdata/model/a.arxml testdata/model/sub
          bin/arxmodel rules --problems --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel check --schema-dir testdata/schemas testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel rules --schema-dir testdata/schemas --emit "$RUNNER_TEMP/lib.rules.txt" testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel check --rules "$RUNNER_TEMP/lib.rules.txt" testdata/model/a.arxml testdata/model/sub/b.arxml
          bin/arxmodel get --schema-dir testdata/schemas /Fiction/Dune testdata/refs
          bin/arxmodel list --schema-dir testdata/schemas BOOK testdata/refs
          bin/arxmodel merge --schema-dir testdata/schemas -o "$RUNNER_TEMP/model.arxml" testdata/export
          bin/arxmodel check --schema-dir testdata/schemas "$RUNNER_TEMP/model.arxml"

      - name: Git merge and diff drivers, with no schema
        run: scripts/git_driver_test.sh bin/arxmodel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reports against their schemas
        run: |
          python -m pip install --quiet jsonschema lxml
          scripts/check_reports.sh bin/arxmodel "$RUNNER_TEMP/reports"
